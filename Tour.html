<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de CV Automatique</title>
    <!-- Inclusion de jsPDF pour générer le PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        #form-container, #cv-preview {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .photo-container {
            text-align: center;
            margin: 20px 0;
        }
        #photo-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #3498db;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #generate-btn {
            background: #3498db;
            color: white;
        }
        #download-btn {
            background: #27ae60;
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Style du CV généré */
        #cv-template {
            display: none;
            padding: 40px;
            background: white;
            color: #2c3e50;
        }
        .cv-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .cv-header h1 {
            margin: 10px 0;
            font-size: 36px;
            color: #2c3e50;
        }
        .cv-contact {
            color: #7f8c8d;
            font-size: 16px;
        }
        .cv-photo {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #3498db;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 22px;
            color: #3498db;
            border-bottom: 3px solid #3498db;
            padding-bottom: 8px;
            margin-top: 30px;
        }
        .summary {
            font-size: 16px;
            line-height: 1.6;
            margin: 20px 0;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            list-style: none;
            padding: 0;
        }
        .skills-list li {
            background: #3498db;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>Générateur de CV Automatique</h1>

    <div class="container">
        <!-- Formulaire -->
        <div id="form-container">
            <h2>Vos informations</h2>

            <div class="photo-container">
                <img id="photo-preview" src="" alt="Prévisualisation photo">
                <br><br>
                <label for="photo-input">Choisir une photo</label>
                <input type="file" id="photo-input" accept="image/*">
            </div>

            <label>Nom complet</label>
            <input type="text" id="fullName" placeholder="Jean Dupont">

            <label>Poste ou titre professionnel</label>
            <input type="text" id="jobTitle" placeholder="Développeur Full Stack">

            <label>Email</label>
            <input type="email" id="email" placeholder="jean.dupont@email.com">

            <label>Téléphone</label>
            <input type="tel" id="phone" placeholder="+33 6 12 34 56 78">

            <label>Adresse</label>
            <input type="text" id="address" placeholder="Paris, France">

            <label>Profil / Résumé professionnel</label>
            <textarea id="summary" placeholder="Résumez votre parcours et vos objectifs en quelques phrases..."></textarea>

            <label>Expériences professionnelles<br><small>(Une par ligne : Poste | Entreprise | Dates | Description brève)</small></label>
            <textarea id="experiences" placeholder="Développeur Web | TechCorp | 2022-Présent | Développement d'applications React et Node.js"></textarea>

            <label>Formations<br><small>(Une par ligne : Diplôme | Établissement | Année)</small></label>
            <textarea id="education" placeholder="Master Informatique | Université de Paris | 2021"></textarea>

            <label>Compétences<br><small>(Séparées par des virgules)</small></label>
            <input type="text" id="skills" placeholder="HTML, CSS, JavaScript, React, Node.js, Python">

            <div class="buttons">
                <button id="generate-btn" onclick="generateCV()">Générer le CV</button>
                <button id="download-btn" onclick="downloadPDF()" style="display:none;">Télécharger en PDF</button>
            </div>
        </div>

        <!-- Aperçu du CV -->
        <div id="cv-preview">
            <div id="cv-template">
                <div class="cv-header">
                    <img id="cv-photo" class="cv-photo" src="" alt="Photo">
                    <h1 id="cv-name"></h1>
                    <p id="cv-title"></p>
                    <p class="cv-contact" id="cv-contact"></p>
                </div>

                <h2 class="section-title">Résumé</h2>
                <p class="summary" id="cv-summary">Aucun résumé fourni.</p>

                <h2 class="section-title">Expériences professionnelles</h2>
                <ul id="cv-experiences"></ul>

                <h2 class="section-title">Formations</h2>
                <ul id="cv-education"></ul>

                <h2 class="section-title">Compétences</h2>
                <ul class="skills-list" id="cv-skills"></ul>
            </div>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        // Prévisualisation de la photo
        document.getElementById('photo-input').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    document.getElementById('photo-preview').src = ev.target.result;
                    document.getElementById('cv-photo').src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function generateCV() {
            // Récupération des données
            const name = document.getElementById('fullName').value || 'Votre Nom';
            const jobTitle = document.getElementById('jobTitle').value || '';
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const summary = document.getElementById('summary').value || 'Aucun résumé fourni.';
            const experiences = document.getElementById('experiences').value.split('\n').filter(l => l.trim());
            const education = document.getElementById('education').value.split('\n').filter(l => l.trim());
            const skills = document.getElementById('skills').value.split(',').map(s => s.trim()).filter(s => s);

            // Mise à jour du CV
            document.getElementById('cv-name').textContent = name;
            document.getElementById('cv-title').textContent = jobTitle;
            document.getElementById('cv-contact').textContent = [email, phone, address].filter(x => x).join(' | ');
            document.getElementById('cv-summary').textContent = summary;

            // Photo par défaut si aucune
            if (!document.getElementById('cv-photo').src) {
                document.getElementById('cv-photo').style.display = 'none';
            } else {
                document.getElementById('cv-photo').style.display = 'block';
            }

            // Expériences
            const expList = document.getElementById('cv-experiences');
            expList.innerHTML = '';
            if (experiences.length === 0) {
                expList.innerHTML = '<li>Aucune expérience saisie.</li>';
            } else {
                experiences.forEach(exp => {
                    const li = document.createElement('li');
                    li.innerHTML = '<strong>' + exp.replace(/ \| /g, '</strong><br>') + '';
                    expList.appendChild(li);
                });
            }

            // Formations
            const eduList = document.getElementById('cv-education');
            eduList.innerHTML = '';
            if (education.length === 0) {
                eduList.innerHTML = '<li>Aucune formation saisie.</li>';
            } else {
                education.forEach(edu => {
                    const li = document.createElement('li');
                    li.innerHTML = '<strong>' + edu.replace(/ \| /g, '</strong><br>') + '';
                    eduList.appendChild(li);
                });
            }

            // Compétences
            const skillsList = document.getElementById('cv-skills');
            skillsList.innerHTML = '';
            if (skills.length === 0) {
                skillsList.innerHTML = '<li style="background:none;color:#777;">Aucune compétence saisie.</li>';
            } else {
                skills.forEach(skill => {
                    const li = document.createElement('li');
                    li.textContent = skill;
                    skillsList.appendChild(li);
                });
            }

            // Afficher le CV et le bouton de téléchargement
            document.getElementById('cv-template').style.display = 'block';
            document.getElementById('download-btn').style.display = 'inline-block';
        }

        async function downloadPDF() {
            const cvElement = document.getElementById('cv-template');

            // Utilisation de html2canvas pour capturer le CV
            const canvas = await html2canvas(cvElement, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            });

            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF('p', 'mm', 'a4');

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();
            const imgWidth = canvas.width;
            const imgHeight = canvas.height;
            const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);
            const imgX = (pdfWidth - imgWidth * ratio) / 2;
            const imgY = 10;

            pdf.addImage(imgData, 'PNG', imgX, imgY, imgWidth * ratio, imgHeight * ratio);
            pdf.save(`${document.getElementById('fullName').value || 'Mon'}_CV.pdf`);
        }
    </script>
</body>
</html>
