<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Font Awesome (icons) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Destination.css">
  <title>Destination-Tours</title>
</head>

<body>
    <!--HEADER SECTION-->
    <header class="header">
        <div class="nav-container">
            <div class="logo">✈Travel</div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <nav class="nav-links">
                <ul> 
                    <li><a href="Home.html"><i class="fas fa-home"></i>Home</a></li>
                    <li><a href="Destination.html"><i class="fas fa-building"></i>Destination</a></li>
                    <li><a href="Hotel.html"><i class="fas fa-handshake"></i>Hotel</a></li>
                    <li><a href="Contact.html"><i class="fas fa-phone"></i>Contact</a></li>
                    <li><a href="Reservation.html"><i class=" fas fa-info-circle"></i>Reservation</a></li>
                </ul>
            </nav>
        </div>
    </header>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* ✅ TOUT COMMENCE AU MILIEU */
main{
    margin-top:150px; /* ajuste si tu veux plus bas */
    width:100%;
}

/* ===== SECTIONS ===== */
section{
    max-width:1100px;
    margin:0 auto 60px auto;
    padding:20px;
    display:none;
}

#step1{
    display:block;
}

h1,h2{
    text-align:center;
    margin-bottom:30px;
}

/* ===== CARTES ===== */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card .content{
    padding:20px;
    text-align:center;
}

.card button{
    margin-top:15px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:25px;
    background:#2d4271;
    color:white;
    cursor:pointer;
}

/* ===== HERO ===== */
.hero{
    height:320px;
    background:url("https://images.unsplash.com/photo-1580910051074-7f7c65efb0b4") center/cover;
    border-radius:20px;
    display:flex;
    align-items:flex-end;
}

.hero h2{
    color:white;
    background:#2d4271;
    padding:15px 25px;
    margin:20px;
    border-radius:10px;
}

/* ===== LISTE ===== */
.list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-top:20px;
}

.list div{
    background:#eee;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

/* ===== FORM ===== */
form{
    max-width:420px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:20px;
}

input,select,button{
    width:100%;
    margin:12px 0;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
}

.bbh{
    background-color: #2d4271;
}

button{
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<main>

<!-- ÉTAPE 1 -->
<section id="step1">
<h1>🌍 Nos Destinations</h1>

<div class="cards">
    <div class="card">
        <img src="https://images.unsplash.com/photo-1549880338-65ddcdfd017b">
        <div class="content">
            <h3>Bénin</h3>
            <p>Culture & Nature</p>
            <button onclick="goStep2()">Voir détails</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34">
        <div class="content">
            <h3>France</h3>
            <p>Romance & Culture</p>
            <button onclick="goStep2()">Voir détails</button>
        </div>
    </div>
</div>
</section>

<!-- ÉTAPE 2 -->
<section id="step2">
<h1>📍 Détail Destination</h1>

<div class="hero">
    <h2>Bénin 🇧🇯</h2>
</div>

<p style="text-align:center;margin-top:20px;">
Une destination riche en culture, histoire et nature.
</p>

<div class="list">
    <div>Ganvié</div>
    <div>Ouidah</div>
    <div>Pendjari</div>
    <div>Cotonou</div>
</div>

<div style="text-align:center;margin-top:30px;">
    <button onclick="goStep3()" class="bbh">Réserver</button>
</div>
</section>

<!-- ÉTAPE 3 -->
<section id="step3">
<h1>🧾 Réservation</h1>

<form>
    <input type="text" placeholder="Nom complet" required>
    <input type="email" placeholder="Email" required>
    <input type="tel" placeholder="Téléphone" required>
    <input type="date" required>
    <select>
        <option>1 Passager</option>
        <option>2 Passagers</option>
        <option>3 Passagers</option>
    </select>
    <button>Confirmer</button>
</form>
</section>

</main>

<script>
function goStep2(){
    step1.style.display="none";
    step2.style.display="block";
    step3.style.display="none";
}
function goStep3(){
    step1.style.display="none";
    step2.style.display="none";
    step3.style.display="block";
}
</script>

</body>
</html>
